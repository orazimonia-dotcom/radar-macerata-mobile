      - name: Prepara il sito mobile con il report
        shell: bash
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp output/report.json site/data/report.json
          cp output/fonti.csv site/data/fonti.csv
          cp output/notizie.csv site/data/notizie.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/report.json').read_text(encoding='utf-8'))
          assert len(p['checks']) == 11, 'Numero fonti pilota diverso da 11'
          assert sum(p['counts'].values()) == 11, 'Conteggi incoerenti'
          assert all(x['state'] in ('GIALLO','ROSSO','GRIGIO','VERDE') for x in p['checks'])
          print('Righe di controllo:',len(p['checks']),'Fonti:',p['counts'])
          PY

x-start;font-size:13px}.source div{flex:1}.source strong,.source small{display:block}.source small{font-size:11px;margin-top:6px;color:var(--muted);line-height:1.4}.source a{white-space:nowrap;font-size:11px}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:5px;background:#aaa}.dot.VERDE{background:#198754}.dot.GIALLO{background:#e6aa22}.dot.ROSSO{background:#bd4b45}.dot.GRIGIO{background:#8b949f}.footer{margin:30px 0;color:var(--muted);font-size:12px}.links{display:flex;gap:16px;flex-wrap:wrap}.hidden{display:none!important}#counter{font-size:13px;color:var(--muted)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.sources{grid-template-columns:1fr}header h1{font-size:27px}}
